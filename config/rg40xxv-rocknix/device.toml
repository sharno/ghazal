# Derived from ROCKNIX H700 DT and its H700 Gamepad RetroArch autoconfiguration.
name = "Anbernic RG40XX-V v2 panel (ROCKNIX hardware stack)"

[input]
gamepad = "H700 Gamepad"

[buttons]
a = 305
b = 304
# Pressing the X button sends BTN_WEST (308) and Y sends BTN_NORTH (307),
# confirmed with a capture of the real pad; the labels don't follow position.
x = 308
y = 307
l1 = 310
r1 = 311
l2 = 312
r2 = 313
select = 314
start = 315
menu = 316
l3 = 317
r3 = 318
up = 544
down = 545
left = 546
right = 547
vol_down = 114
vol_up = 115
power = 116

[display]
output = "kms"
card = "/dev/dri"

[backlight]
kind = "sysfs"
path = "/sys/class/backlight/backlight/brightness"
# Resolve the PWM range from this kernel's max_brightness (2499 on the v2 panel).
max = "kernel"
min = 1

[audio]
card = 0
control = "DAC Playback Volume"
route = [
  { switch = { control = "DAC Playback Switch", enabled = true } },
  { volume = { control = "Line Out Playback Volume", percent = 100 } },
  { switch = { control = "Line Out Playback Switch", enabled = true } },
]
# Off while headphones are plugged in; PipeWire's UCM does this on ROCKNIX.
speaker = "Speaker Switch"

[battery]
path = "/sys/class/power_supply/battery"

[rtc]
# rtc0 is the battery-backed PCF8563 without a wake IRQ; rtc1 is the SoC RTC.
wakealarm = "/sys/class/rtc/rtc1/wakealarm"

[leds]
power = "/sys/class/leds/green:power/brightness"
# The red LED beside it, as muOS uses it.
low_battery = "/sys/class/leds/red:status/brightness"

[lights]
# RG40XX H/V and RG CubeXX stick rings; other boards lack this LED.
power = "/sys/class/leds/rgb:kbd_backlight/brightness"
uart = "5001400.serial"

[cpu]
# Up to 1008 MHz the tested RG40XX-V runs its CPU at the lowest voltage
# (0.9 V; 1.1 V at 1416 MHz), so floors there cost little energy and leave
# frame-pacing headroom; schedutil climbs past them when a game needs more.
policy = "/sys/devices/system/cpu/cpufreq/policy0"
menu = { governor = "schedutil", min_khz = 480000 }
light = { governor = "schedutil", min_khz = 720000 }
moderate = { governor = "schedutil", min_khz = 1008000 }
# muOS's policy for every game: full speed throughout.
full = { governor = "performance", min_khz = 480000 }
