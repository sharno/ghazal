# Independent rootfs paths; cores come from the pinned ROCKNIX bundle.

# Games live on SD2.
rom_roots = ["/mnt/games/ROMS"]
activity_file = "/mnt/games/.oxmux/activity.toml"

[retroarch]
bin = "/usr/bin/retroarch"
# Our own RetroArch configuration.
configs = ["/etc/oxmux/retroarch.cfg"]
core_dirs = ["/usr/lib/libretro"]
extra_args = ["-f"]
log = "/var/log/oxmux/retroarch.log"
env = { HOME = "/root", XDG_RUNTIME_DIR = "/run" }

[[system]]
name = "Game Boy"
dirs = ["GB", "Game Boy", "Nintendo Game Boy", "Nintendo - Game Boy"]
extensions = ["gb", "zip", "7z"]
core = "gambatte_libretro.so"

