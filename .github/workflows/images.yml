name: H700 images
on:
  push:
    branches: [main]
    tags: ['v*-beta.*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta release tag, e.g. v0.1.0-beta.1'
        required: true
        type: string
      artifact_run:
        description: 'Optional successful tag build run to resume publication without rebuilding'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: h700-images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    if: inputs.artifact_run == ''
    uses: ./.github/workflows/check.yml
  runtime:
    if: inputs.artifact_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - uses: actions/cache@v4
        with:
          path: build/release-tools/runtime.nar.gz
          key: h700-runtime-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'hardware.lock', 'Cargo.lock', 'tools/image-builder/Cargo.lock', 'config/**', 'src/**', 'ui/**', 'assets/**', 'tools/image-builder/src/**') }}
          restore-keys: h700-runtime-${{ runner.os }}-
      - name: Build shared runtime, all device trees and both bootloaders
        run: |
          nix flake check --no-build
          mkdir -p build/release-tools
          if test -f build/release-tools/runtime.nar.gz; then
            gzip -dc build/release-tools/runtime.nar.gz | nix-store --import
          fi
          builder=$(nix build .#image-builder --no-link --print-out-paths)
          printf '%s\n' "$builder" > build/release-tools/store-path.txt
          "$builder/bin/ghazal-image-builder" --matrix > build/release-tools/devices.json
          nix-store --query --requisites "$builder" > build/release-tools/paths.txt
          mapfile -t paths < build/release-tools/paths.txt
          nix-store --export "${paths[@]}" | gzip -1 > build/release-tools/runtime.nar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-tools
          path: build/release-tools/
          retention-days: 3
          compression-level: 0
  images:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        memory: [ddr3, ddr4]
    env:
      VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('ci-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: actions/download-artifact@v4
        with:
          name: release-tools
          path: build/release-tools
      - name: Import the identical checked runtime
        run: gzip -dc build/release-tools/runtime.nar.gz | nix-store --import
      - name: Build and verify every H700 device image
        env:
          RAUC_SIGNING_KEY: ${{ secrets.RAUC_SIGNING_KEY }}
        run: |
          if test -n "$RAUC_SIGNING_KEY"; then
            umask 077
            printf '%s\n' "$RAUC_SIGNING_KEY" > "$RUNNER_TEMP/rauc-release.key"
            export GHAZAL_UPDATE_KEY="$RUNNER_TEMP/rauc-release.key"
            trap 'rm -f "$RUNNER_TEMP/rauc-release.key"' EXIT
          elif [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'RAUC_SIGNING_KEY is required for a release' >&2
            exit 1
          fi
          builder=$(cat build/release-tools/store-path.txt)
          "$builder/bin/ghazal-image-builder" --all --memory '${{ matrix.memory }}' --version "$VERSION" "$PWD" "$PWD/dist"
          cd dist
          sha256sum -c ./*.sha256
          expected=$(jq '.include | map(select(.memory == "${{ matrix.memory }}")) | length' ../build/release-tools/devices.json)
          actual=$(find . -maxdepth 1 -name '*.img.gz' | wc -l)
          test "$actual" -eq "$expected"
          if test -n "$RAUC_SIGNING_KEY"; then
            bundles=$(find . -maxdepth 1 -name '*.raucb' | wc -l)
            test "$bundles" -eq "$expected"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.memory }}
          path: dist/
          retention-days: 7
          compression-level: 0
  publish:
    if: >-
      always() && !cancelled() &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      (inputs.artifact_run != '' || (needs.checks.result == 'success' && needs.images.result == 'success'))
    needs: [checks, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate reused build provenance
        if: inputs.artifact_run != ''
        env:
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" > build-run.json
          jq -e --arg sha "$tag_sha" --arg tag "$TAG" '.head_sha == $sha and .head_branch == $tag and .event == "push" and .path == ".github/workflows/images.yml" and .status == "completed"' build-run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN/jobs?per_page=100" --jq '.jobs[]' | jq -s -e '
            . as $jobs |
            ["runtime", "checks / check", "images (ddr3)", "images (ddr4)"] as $required |
            all($required[]; . as $name | any($jobs[]; .name == $name and .conclusion == "success"))' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          pattern: images-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run || github.run_id }}
      - name: Verify and publish the complete beta
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          cd dist
          sha256sum -c ./*.sha256
          sha256sum ./*.img.gz ./*.raucb > SHA256SUMS
          cd ..
          # Tags are created before release builds. Omitting target_commitish avoids
          # requiring workflow-write permission when main has since advanced.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true
          else
            gh release create "$TAG" --verify-tag --draft --prerelease --title "Ghazal $TAG — H700 beta" --notes-file docs/beta-release.md
          fi
          gh release upload "$TAG" dist/*.img.gz dist/*.raucb dist/SHA256SUMS docs/installation.md docs/storage-layout.md docs/updates.md config/h700/devices.toml --clobber
          gh release edit "$TAG" --draft=false
