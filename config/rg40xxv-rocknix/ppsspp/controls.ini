; PPSSPP pad mapping for the RG40XX-V, matching RetroArch's hotkeys.
; PSP buttons follow position: Cross bottom, Circle right, Square left,
; Triangle top. Codes are DEVICE-KEY; device 10 is the first pad. Through
; the kernel and SDL's "H700 Gamepad" mapping, the physical buttons arrive as
; A (right)=189 B (bottom)=190 X (top)=191 Y (left)=188 L1=193 R1=192
; Select=196 Start=197 Menu=4, d-pad 19-22, sticks 4000-4007.
; "a:b" means both keys held together.
; Menu + Start (quit) is handled by ghazal's daemon, as for every emulator.
[ControlMapping]
Up = 10-19
Down = 10-20
Left = 10-21
Right = 10-22
Circle = 10-189
Cross = 10-190
Square = 10-188
Triangle = 10-191
Start = 10-197
Select = 10-196
L = 10-193
R = 10-192
An.Up = 10-4003
An.Down = 10-4002
An.Left = 10-4001
An.Right = 10-4000
RightAn.Up = 10-4007
RightAn.Down = 10-4006
RightAn.Left = 10-4005
RightAn.Right = 10-4004
Pause = 10-4:10-191
Pause (no menu) = 10-4:10-189
Save State = 10-4:10-192
Load State = 10-4:10-193
