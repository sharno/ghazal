# PortMaster ports are shell scripts directly in ROMS/PORTS; a port's data sits in
# a folder beside its script, so the scan does not descend. `ghazal ports run`
# gives each one /roms/ports, the glibc loader, bash and the libraries it expects.
[[system]]
name = "Ports"
dirs = ["PORTS", "Ports", "ports"]
extensions = ["sh"]
depth = 0
command = ["/opt/ghazal/ghazal", "ports", "run", "{rom}"]
log = "/var/log/ghazal/ports.log"
art = { muos = "External - Ports" }
