video_driver = "gl"
log_verbosity = "true"
frontend_log_level = "1"
libretro_log_level = "1"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
audio_driver = "alsathread"
audio_device = "hw:0,0"
input_driver = "udev"
input_joypad_driver = "udev"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
libretro_directory = "/usr/lib/libretro"
system_directory = "/mnt/games/BIOS"
savefile_directory = "/mnt/games/SAVES/file"
savestate_directory = "/mnt/games/SAVES/state"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
# Resume where the player left: quitting (Menu + Start, idle or power-off)
# writes a state that the next launch of the same game loads.
savestate_auto_save = "true"
savestate_auto_load = "true"
# Manual saves advance automatically and retain the latest ten numbered states.
# The automatic resume state remains separate.
savestate_auto_index = "true"
savestate_max_keep = "10"
network_cmd_enable = "true"
network_cmd_port = "55355"
menu_driver = "rgui"
rgui_show_start_screen = "false"
config_save_on_exit = "true"
rgui_config_directory = "/mnt/games/.ghazal/retroarch/config"
core_options_path = "/mnt/games/.ghazal/retroarch/retroarch-core-options.cfg"
cache_directory = "/mnt/games/.ghazal/cache"
