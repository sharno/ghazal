name: Rust checks
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Check runtime and image builder
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --features desktop --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/image-builder/Cargo.toml -- -D warnings
          cargo clippy --locked --manifest-path tools/data-migration/Cargo.toml -- -D warnings
      - name: Run unit tests
        run: |
          cargo test --locked
          cargo test --locked --manifest-path tools/image-builder/Cargo.toml
      - name: Build static handheld executable
        run: |
          sysroot=$(rustc --print sysroot)
          export PATH="$sysroot/lib/rustlib/x86_64-unknown-linux-gnu/bin:$PATH"
          cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: Exercise first-boot growth and restart recovery on a disposable disk
        # The runner's exfatprogs is too old for the device's no-discard formatter.
        # Resolve the tool from our locked nixpkgs, matching the shipped version.
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify storage transactions with the pinned formatter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y exfat-fuse
          exfat=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#exfatprogs^out')
          cargo test --locked --no-run --message-format=json > /tmp/ghazal-tests.json
          binary=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "ghazal") | .executable' /tmp/ghazal-tests.json)
          rustc_path=$(rustup which rustc)
          mounter=$(command -v mount.exfat-fuse)
          sudo env GHAZAL_TEST_RUSTC="$rustc_path" GHAZAL_TEST_MOUNT_EXFAT="$mounter" GHAZAL_TEST_MKFS_EXFAT="$exfat/bin/mkfs.exfat" GHAZAL_TEST_FSCK_EXFAT="$exfat/bin/fsck.exfat" "$binary" --ignored --exact init::storage::tests::factory_loopback_preparation_preserves_existing_data --nocapture
