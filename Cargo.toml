[package]
name = "ghazal"
version = "0.1.0"
edition = "2021"
description = "Ghazal: a standalone Linux gaming system for Anbernic H700 handhelds"
license = "GPL-3.0-or-later"

[features]
default = []
# Desktop simulator window (winit + softbuffer). Not used on the device.
desktop = ["dep:winit", "dep:softbuffer"]

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
slint = { version = "1.18", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
evdev = "0.12"
# Not used directly: makes Slint's font lookup dlopen fontconfig instead of linking it,
# keeping the device binary static. Without fontconfig only the embedded fonts are used.
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
png = "0.17"
drm = { version = "0.14", default-features = false }

[build-dependencies]
slint-build = "1.18"
resvg = { version = "0.48.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
