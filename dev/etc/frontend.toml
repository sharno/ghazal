# Desktop simulator config: `cargo sim`. Paths are relative to this file.
# device.toml and system.toml fall back to the built-in RG40XXV ones.
# Keys: arrows = d-pad, Z/Enter = A, X/Backspace = B, A = Y, S = X,
# Q/W = L1/R1, Shift = Select, Space = Start, Esc/Tab = Menu.
rom_roots = ["../ROMS"]
# Where the simulator keeps emulator choices (the device keeps them on the data card).
emulators_file = "/tmp/ghazal-sim/emulators.toml"

[retroarch]
bin = "retroarch"
core_dirs = ["../cores", "/usr/lib/libretro"]

# Applications -> Moonlight, with its hosts and settings in dev/moonlight
# (ignored by git). Without `moonlight` on PATH its helpers fail with a message.
[moonlight]
bin = "moonlight"
data_dir = "../moonlight"

[[system]]
name = "Game Boy Advance"
dirs = ["GBA"]
extensions = ["gba", "zip"]
core = "mgba_libretro.so"
label = "mGBA"

# X in a game list picks among these.
[[system.alternative]]
core = "vba_next_libretro.so"
label = "VBA-Next"
cpu = "moderate"

[[system]]
name = "SNES"
dirs = ["SNES", "SFC"]
extensions = ["sfc", "smc", "zip"]
core = "snes9x_libretro.so"
label = "Snes9x"

[[system.alternative]]
core = "snes9x2010_libretro.so"
label = "Snes9x 2010"

[[system.alternative]]
command = ["/usr/bin/true", "{rom}"]
name = "demo-standalone"
label = "Demo standalone"

[[system]]
name = "Game Boy"
dirs = ["GB"]
extensions = ["gb", "zip"]
core = "gambatte_libretro.so"

[[system]]
name = "Empty System (hidden)"
dirs = ["NOPE"]
extensions = ["x"]
core = "none_libretro.so"
