# Derived from ROCKNIX H700 DT and its H700 Gamepad RetroArch autoconfiguration.
name = "Anbernic RG40XX-V v2 panel (ROCKNIX hardware stack)"

[input]
gamepad = "H700 Gamepad"

[buttons]
a = 305
b = 304
x = 307
y = 308
l1 = 310
r1 = 311
l2 = 312
r2 = 313
select = 314
start = 315
menu = 316
l3 = 317
r3 = 318
up = 544
down = 545
left = 546
right = 547
vol_down = 114
vol_up = 115
power = 116

[display]
output = "kms"
card = "/dev/dri"

[backlight]
kind = "sysfs"
path = "/sys/class/backlight/backlight/brightness"
# PWM backlight has no DT brightness table: Linux default range is 0..255.
max = 255
min = 1

[audio]
card = 0
control = "DAC Playback Volume"
route = [
  { switch = { control = "DAC Playback Switch", enabled = true } },
  { volume = { control = "Line Out Playback Volume", percent = 100 } },
  { switch = { control = "Line Out Playback Switch", enabled = true } },
  { switch = { control = "Speaker Switch", enabled = true } },
]

[battery]
path = "/sys/class/power_supply/battery"

[rtc]
# rtc0 is the battery-backed PCF8563 without a wake IRQ; rtc1 is the SoC RTC.
wakealarm = "/sys/class/rtc/rtc1/wakealarm"

[leds]
power = "/sys/class/leds/green:power/brightness"
