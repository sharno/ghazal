# Independent rootfs paths; RetroArch, cores and PPSSPP come from nix/runtime.

# Games live on SD2.
rom_roots = ["/mnt/games/ROMS"]
# Systems with `requires_any` stay hidden until one of those BIOS files is here.
bios_dir = "/mnt/games/BIOS"
# Box art: next to ROMs (Imgs/), muOS's catalogue, then downloads (Options menu).
thumbnail_cache = "/mnt/games/.ghazal/thumbnails"
muos_catalogue = "/mnt/games/MUOS/info/catalogue"
activity_file = "/mnt/games/.ghazal/activity.toml"
# Emulators chosen per game and per system (X in a game list).
emulators_file = "/mnt/games/.ghazal/emulators.toml"

# udev starts with the background services after the menu's first frame; a
# Last Game startup must not launch before it has catalogued the gamepad.
launch_after = ["/run/ghazal/udev-settled"]

# Applications -> Moonlight streams PC games from Sunshine or GeForce
# Experience. Pairing keys, known hosts and stream settings live on the data
# card, so a reflashed OS card keeps its pairings. Video is decoded in software.
[moonlight]
bin = "/usr/bin/moonlight"
data_dir = "/mnt/games/.ghazal/moonlight"
mapping = "/usr/share/moonlight/gamecontrollerdb.txt"
env = { HOME = "/mnt/games/.ghazal/home", XDG_RUNTIME_DIR = "/run", XDG_CACHE_HOME = "/mnt/games/.ghazal/cache" }
log = "/var/log/ghazal/moonlight.log"

[retroarch]
bin = "/usr/bin/retroarch"
# Our own RetroArch configuration.
configs = ["/etc/ghazal/retroarch.cfg"]
user_config = "/mnt/games/.ghazal/retroarch/retroarch.cfg"
core_dirs = ["/usr/lib/libretro"]
extra_args = ["-f"]
log = "/var/log/ghazal/retroarch.log"
env = { HOME = "/mnt/games/.ghazal/home", XDG_CONFIG_HOME = "/mnt/games/.ghazal", XDG_CACHE_HOME = "/mnt/games/.ghazal/cache", XDG_RUNTIME_DIR = "/run" }
# A launch that signs in to RetroAchievements or joins netplay waits up to this
# many seconds for Wi-Fi, and only when a Wi-Fi network is saved.
online_wait = 8

# Configuration -> Achievements account opens RetroArch's menu and presses
# these keys through its network command port (network_cmd_port in
# retroarch.cfg). From the main menu, Up wraps to the last entry: Quit, Restart,
# Configuration File, Information, then Settings (5 presses), and in Settings
# Up from the top reaches Logging, Directory, User, then Achievements (4 presses).
# Derived from RetroArch 1.22's menu source; adjust here if the layout differs.
[retroarch.menu_paths]
achievements = ["up", "up", "up", "up", "up", "a", "up", "up", "up", "up", "a"]

# Game actions (X on a game) can host or join a netplay session; Applications ->
# Join netplay finds hosts by itself. A host answers a LAN broadcast with the
# game it plays; hosts on another network (a VPN) can be listed by hand in
# hosts_file, one `address[:port] [name]` per line.
[netplay]
port = 55435
discovery_ms = 1500
hosts_file = "/mnt/games/.ghazal/netplay-hosts.txt"

# Applied over the user's RetroArch config for netplay launches only.
[netplay.retroarch]
# RetroArch writes its settings on exit, including these: keep them out of the
# config used for solo play.
config_save_on_exit = "false"
# LAN only: no listing on libretro's public lobby, no relay, and no UPnP or
# NAT-PMP request that opens a port on the router.
netplay_public_announce = "false"
netplay_use_mitm_server = "false"
netplay_nat_traversal = "false"
# A session starts from the host's state: the solo resume state must neither
# load into it nor be overwritten by it.
savestate_auto_load = "false"
savestate_auto_save = "false"

# PortMaster support (docs/ports.md): Applications -> PortMaster installs and runs it,
# and the Ports system at the end of this file lists the ports it installs.
# Everything but the folder has the device default (src/ports/mod.rs).
[ports]
dir = "PORTS"

# `cpu` picks a clock floor from device.toml [cpu]. Measured on one game's
# intro, emulation plus ~2.7 ms of presentation fits a 60 Hz frame below
# 480 MHz for light systems and below 720 MHz for moderate ones; heavier scenes
# raise the clock above the floor. Unlisted systems run at full clock.
#
# A system's own `core` or `command` is its default emulator. Each
# `[[system.alternative]]` adds an emulator the player can pick in a game list
# (X), for one game or for the whole system; it takes the same keys (`core` or
# `command`, `env`, `log`, `cpu`), plus `name` for a standalone command (what a
# saved choice refers to; the program's file name when unset) and `label`, the
# name the picker shows. An alternative's `cpu` is rated separately and, unrated,
# runs at full clock. Floors below were measured on the system's own core only:
# an alternative gets the same floor when it is no heavier, which is unverified.
# Saves are kept per core (SAVES/*/<core name>), so a game's saves do not follow
# it to another emulator.
[[system]]
name = "Game Boy"
dirs = ["GB", "Game Boy", "Nintendo Game Boy", "Nintendo - Game Boy"]
extensions = ["gb", "zip", "7z"]
core = "gambatte_libretro.so"
cpu = "light"
art = { libretro = "Nintendo - Game Boy", muos = "Nintendo Game Boy" }

[[system]]
name = "Game Boy Color"
dirs = ["GBC", "Game Boy Color", "Nintendo Game Boy Color", "Nintendo - Game Boy Color"]
extensions = ["gbc", "gb", "zip", "7z"]
