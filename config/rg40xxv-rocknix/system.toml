# A/B boot attempts are owned by U-Boot/RAUC, independently for each slot.

[[init.step]]
mount = { source = "proc", target = "/proc", fstype = "proc", options = "nosuid,nodev,noexec" }
[[init.step]]
mount = { source = "sysfs", target = "/sys", fstype = "sysfs", options = "nosuid,nodev,noexec" }
[[init.step]]
mount = { source = "devtmpfs", target = "/dev", fstype = "devtmpfs", options = "nosuid" }
[[init.step]]
mount = { source = "devpts", target = "/dev/pts", fstype = "devpts", options = "nosuid,noexec,gid=5,mode=0620" }
[[init.step]]
mount = { source = "tmpfs", target = "/run", fstype = "tmpfs", options = "nosuid,nodev,mode=0755" }
[[init.step]]
mount = { source = "tmpfs", target = "/tmp", fstype = "tmpfs", options = "nosuid,nodev" }
[[init.step]]
mount = { source = "none", target = "/", fstype = "none", options = "remount,ro,noatime" }
[[init.step]]
mount = { source = "/dev/mmcblk0p6", target = "/var", fstype = "ext4", options = "rw,noatime", wait = 3 }
[[init.step]]
hostname = "ghazal"
[[init.step]]
mount = { source = "/dev/mmcblk0p1", target = "/mnt/boot", fstype = "vfat", options = "rw,noatime", optional = true }
[[init.step]]
provision = "/mnt/boot/provision.toml"
[[init.step]]
storage = {}
[[init.step]]
data-mount = {}
[[init.step]]
data-directories = {}
[[init.step]]
mkdir = "/run/dbus"
[[init.step]]
mkdir = "/run/sshd"

[power]
suspend = "disabled"
suspend_checkpoint = "/var/lib/ghazal/suspend-checkpoint"
poweroff = "signal-init"
reboot = "signal-init"
# Require true suspend-to-RAM; do not silently select s2idle.
mem_sleep = "deep"
sleep_poweroff_after = 3600
before_suspend = [["/usr/bin/amixer", "-c", "0", "sset", "DAC", "off"]]
after_resume = [["/usr/bin/amixer", "-c", "0", "sset", "DAC", "on"]]

[daemon]
state = "/var/lib/ghazal/settings.toml"
socket = "/run/ghazal/daemon.sock"
[daemon.idle]
# Native wake is under investigation; keep the device usable until validated.
sleep_after = 0
# Until sleep works, an untouched device shuts down instead of draining.
poweroff_after = 1800
[[daemon.hotkey]]
keys = ["vol_up"]
action = "volume-up"
[[daemon.hotkey]]
keys = ["vol_down"]
action = "volume-down"
[[daemon.hotkey]]
keys = ["menu", "vol_up"]
action = "brightness-up"
[[daemon.hotkey]]
keys = ["menu", "start"]
action = "stop-emulator"
[[daemon.hotkey]]
keys = ["menu", "vol_down"]
action = "brightness-down"

[supervisor]
log_dir = "/var/log/ghazal"
[[supervisor.service]]
name = "update-health"
exec = ["/opt/ghazal/ghazal", "update", "health"]
wait_for = ["/dev/watchdog0"]
restart = "always"
[[supervisor.service]]
name = "rauc"
exec = ["/usr/bin/rauc", "service"]
after = ["dbus"]
wait_for = ["/run/dbus/system_bus_socket", "/run/ghazal/update-requested"]
restart = "always"
# The boot critical path is audio -> daemon -> frontend. They use kernel device
# nodes directly, so none of them waits for udev; udev only serves RetroArch.
# Background work waits for the first menu frame so it can't slow it down.
[[supervisor.service]]
name = "kernel-log"
exec = ["/opt/ghazal/ghazal", "kernel-log"]
restart = "always"
[[supervisor.service]]
name = "udev"
exec = ["/usr/lib/systemd/systemd-udevd"]
restart = "always"
[[supervisor.service]]
name = "udev-trigger"
kind = "oneshot"
exec = ["/usr/bin/udevadm", "trigger", "--action=add"]
after = ["udev"]
wait_for = ["/run/udev/control"]
[[supervisor.service]]
name = "udev-settle"
kind = "oneshot"
exec = ["/usr/bin/udevadm", "settle", "--timeout=10"]
after = ["udev-trigger"]
[[supervisor.service]]
name = "dbus"
exec = ["/usr/bin/dbus-daemon", "--config-file=/etc/dbus-1/system.conf", "--nofork", "--nopidfile"]
restart = "always"
[[supervisor.service]]
name = "wifi"
exec = ["/usr/lib/iwd"]
after = ["dbus"]
wait_for = ["/run/dbus/system_bus_socket"]
restart = "always"
[[supervisor.service]]
name = "ssh-host-key"
kind = "oneshot"
exec = ["/opt/ghazal/ghazal", "ssh-key"]
[[supervisor.service]]
name = "sshd"
exec = ["/usr/sbin/sshd", "-D", "-e"]
after = ["ssh-host-key"]
restart = "always"
[[supervisor.service]]
name = "syncthing"
exec = ["/usr/bin/syncthing", "serve", "--home=/mnt/games/.ghazal/syncthing", "--no-browser", "--no-restart", "--no-upgrade", "--gui-address=http://127.0.0.1:8384"]
# ROMS exists only on the prepared data card; never write identity/database to
# the empty mount point on the OS card when SD2 is absent.
wait_for = ["/mnt/games/ROMS", "/run/ghazal/first-frame-ready"]
restart = "always"
env = { HOME = "/root", GOMAXPROCS = "2" }
[[supervisor.service]]
name = "audio"
kind = "oneshot"
exec = ["/opt/ghazal/ghazal", "audio-init"]
wait_for = ["/dev/snd/controlC0"]
[[supervisor.service]]
name = "daemon"
exec = ["/opt/ghazal/ghazal", "daemon"]
after = ["audio"]
restart = "always"
[[supervisor.service]]
name = "frontend"
exec = ["/opt/ghazal/ghazal", "frontend"]
after = ["daemon"]
wait_for = ["/dev/dri", "/run/ghazal/daemon.sock"]
restart = "always"
env = { GHAZAL_EMBEDDED = "1", HOME = "/root", XDG_RUNTIME_DIR = "/run" }
