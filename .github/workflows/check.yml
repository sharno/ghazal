name: Rust checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Check runtime and image builder
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/image-builder/Cargo.toml -- -D warnings
          cargo clippy --locked --manifest-path tools/data-migration/Cargo.toml -- -D warnings
      - name: Run unit tests
        run: cargo test --locked
      - name: Build static handheld executable
        run: |
          export PATH="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin:$PATH"
          cargo build --release --locked --target aarch64-unknown-linux-musl
